<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f7fa;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  color: #172033;
}

.app {
  max-width: 1050px;
  margin: auto;
  padding: 28px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 30px;
  margin-bottom: 26px;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
  min-width: 0;
}

.logo-link {
  display: flex;
  align-items: center;
  flex-shrink: 0;
  text-decoration: none;
}

.brand-logo {
  width: 72px;
  height: 72px;
  object-fit: contain;
  display: block;
}

.header-title {
  min-width: 0;
}

.header-title h1 {
  margin: 0 0 5px;
  font-size: 28px;
  line-height: 1.15;
}

.header-title p {
  margin: 0;
  color: #667085;
}

.brand-block {
  flex-shrink: 0;
  text-align: right;
}

.brand {
  font-size: 13px;
  color: #667085;
}

.brand a {
  color: inherit;
  text-decoration: none;
}

.brand a:hover {
  text-decoration: underline;
}

.version {
  margin-top: 4px;
  font-size: 11px;
  color: #98a2b3;
}

nav {
  display: flex;
  gap: 6px;
  border-bottom: 1px solid #dfe3e8;
  margin-bottom: 30px;
}

.nav {
  border: none;
  background: transparent;
  padding: 13px 17px;
  cursor: pointer;
  font-weight: 600;
  color: #667085;
}

.nav.active {
  color: #1f4e78;
  border-bottom: 3px solid #1f4e78;
}

.section-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 20px;
}

.section-header h2 {
  margin: 0 0 5px;
}

.section-header p {
  margin: 0;
  color: #667085;
}

button {
  border: 1px solid #d0d5dd;
  background: white;
  border-radius: 8px;
  padding: 10px 16px;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
}

button:hover {
  opacity: .88;
}

button.primary {
  border: none;
  background: #1f4e78;
  color: white;
  font-weight: 600;
}

button.danger {
  color: #b42318;
  border-color: #f0b8b4;
}

.cards {
  display: grid;
  gap: 14px;
}

.card {
  background: white;
  border: 1px solid #e4e7ec;
  padding: 18px;
  border-radius: 10px;
}

.card-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.card-title strong {
  font-size: 17px;
}

.card p {
  margin: 5px 0;
  color: #667085;
}

.badge {
  padding: 4px 8px;
  border-radius: 100px;
  font-size: 12px;
  background: #e7f6ec;
  color: #067647;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
}

th,
td {
  padding: 13px;
  border-bottom: 1px solid #eaecf0;
  text-align: left;
  vertical-align: middle;
}

th {
  font-size: 12px;
  text-transform: uppercase;
  color: #667085;
}

/* API Keys: mantener una sola línea por registro. */
#keysList {
  overflow-x: auto;
}

#keysList table {
  width: 100%;
  min-width: 1180px;
  table-layout: auto;
  background: #ffffff;
}

#keysList th,
#keysList td {
  white-space: nowrap !important;
  background: #ffffff;
  vertical-align: middle;
}

#keysList th:nth-child(1),
#keysList td:nth-child(1) {
  min-width: 260px;
}

#keysList th:nth-child(2),
#keysList td:nth-child(2) {
  min-width: 250px;
}

#keysList th:nth-child(3),
#keysList td:nth-child(3) {
  min-width: 250px;
}

#keysList th:nth-child(4),
#keysList td:nth-child(4) {
  min-width: 250px;
}

#keysList th:nth-child(5),
#keysList td:nth-child(5) {
  min-width: 140px;
}

#keysList th:nth-child(6),
#keysList td:nth-child(6) {
  min-width: 170px;
  white-space: nowrap !important;
}

#keysList td:nth-child(6) button {
  display: inline-block;
  margin-right: 6px;
  white-space: nowrap;
}

#keysList code {
  white-space: nowrap !important;
}

/* API Key revocada: fondo blanco y sólo texto atenuado. */
#keysList tr.revoked-row {
  background: #ffffff !important;
}

#keysList tr.revoked-row td,
#keysList tr.revoked-row th {
  background: #ffffff !important;
  color: #b3bac5 !important;
}

#keysList tr.revoked-row code {
  color: #b3bac5 !important;
}

#keysList tr.revoked-row button {
  color: #b3bac5 !important;
  border-color: #e4e7ec !important;
  background: #ffffff !important;
  opacity: 0.55;
}

#keysList button:disabled {
  cursor: not-allowed;
  pointer-events: none;
  opacity: 0.45;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-top: 14px;
  margin-bottom: 5px;
}

input,
select {
  width: 100%;
  padding: 11px;
  border: 1px solid #d0d5dd;
  border-radius: 7px;
  font-size: 14px;
  background: white;
}

input[readonly] {
  background: #f8fafc;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .4);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 25px;
  z-index: 5000;
}

.modal-card {
  width: 100%;
  max-width: 500px;
  max-height: 90vh;
  overflow-y: auto;
  background: white;
  border-radius: 14px;
  padding: 26px;
}

.modal-card h2 {
  margin-top: 0;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 25px;
}

.hidden {
  display: none !important;
}

.secret {
  font-family: monospace;
  font-size: 15px;
  background: #f2f4f7;
  padding: 15px;
  margin: 20px 0;
  border-radius: 8px;
  word-break: break-all;
}

.full {
  width: 100%;
  margin-top: 8px;
}

.empty {
  color: #667085;
  background: white;
  padding: 30px;
  border-radius: 10px;
  text-align: center;
}

.copy-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.copy-row input {
  flex: 1;
  font-family: monospace;
}

.copy-button-row {
  margin-top: 8px;
}

.helper {
  font-size: 12px;
  color: #667085;
  margin-top: 15px;
}

.request-box {
  background: #f2f4f7;
  padding: 16px;
  border-radius: 8px;
  margin-top: 6px;
}

.request-box pre {
  white-space: pre-wrap;
  word-break: break-word;
  margin: 0 0 15px;
  font-family: monospace;
  font-size: 13px;
}

#auditList {
  overflow-x: auto;
}

#auditList th,
#auditList td {
  white-space: nowrap;
}

.toast {
  position: fixed;
  right: 24px;
  bottom: 24px;
  background: #172033;
  color: #ffffff;
  padding: 12px 16px;
  border-radius: 9px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
  opacity: 0;
  transform: translateY(10px);
  pointer-events: none;
  transition:
    opacity .2s ease,
    transform .2s ease;
  z-index: 9999;
}

.toast.show {
  opacity: 1;
  transform: translateY(0);
}

</style>
